      - SOCKS5
    post:
      consumes:
      - application/json
      parameters:
      - description: Client UID
        in: path
        name: uid
        required: true
        type: string
      - description: '{Socks5port: port, UserName: username, Password: password}'
        in: body
        name: body
        required: true
