        in: path
        name: uid
        required: true
        type: string
      - description: '{Socks5port: port, UserName: username, Password: password}'
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            type: object
        "400":
          description: bad request
          schema:
            type: object
